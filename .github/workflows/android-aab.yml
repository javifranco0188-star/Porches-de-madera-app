name: Android AAB Google Play

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-aab.yml'
      - 'app.json'
      - 'eas.json'

jobs:
  build-aab:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar configuración
        run: |
          test -n "$EXPO_TOKEN"
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

      - name: Instalar dependencias
        run: npm install --include=dev --no-audit --no-fund

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Compilar AAB firmado de producción con EAS
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > eas-build.json
          cat eas-build.json

      - name: Descargar AAB generado
        run: |
          BUILD_URL=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('eas-build.json','utf8'));const b=Array.isArray(x)?x[0]:x;process.stdout.write((b.artifacts&&b.artifacts.buildUrl)||'')")
          test -n "$BUILD_URL"
          curl -L "$BUILD_URL" -o Porches-de-Madera-Google-Play.aab
          test -s Porches-de-Madera-Google-Play.aab

      - name: Guardar AAB
        uses: actions/upload-artifact@v4
        with:
          name: Porches-de-Madera-Google-Play-AAB
          path: Porches-de-Madera-Google-Play.aab
          if-no-files-found: error
